<div class="row">
  <div class="card shadow border-0 mb-7 col-md-6 col-lg-6">
    <div class="card-body">
      <h5 class="card-title">Category Distribution</h5>
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>
  <div class="card shadow border-0 mb-7 col-md-6 col-lg-6">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title mb-0">Category Sales Trend</h5>
        <span class="text-muted small">Recent 30 days</span>
      </div>
      <div class="chart-container">
        <canvas id="categoryTrendChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script>
  // Wait for DOM to be ready
  document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, initializing charts...');

  const textColor = '#666';
  const gridColor = '#e5e5e5';
  const backgroundColor = '#ffffff';

  // Pie Chart
  const pieCanvas = document.getElementById('pieChart');
  if (pieCanvas) {
      console.log('Creating pie chart...');
      const ctxPie = pieCanvas.getContext('2d');
      const categoryLabels = {{ categories|safe }} || [];
      const categoryValues = {{ category_counts|safe }} || [];
      const categoryTotal = categoryValues.reduce((total, value) => total + Number(value || 0), 0);
      const categoryColors = ['#2563eb', '#ec4899', '#f59e0b', '#10b981', '#8b5cf6', '#06b6d4', '#f97316', '#64748b'];

      const centerTextPlugin = {
          id: 'categoryCenterText',
          beforeDraw: function(chart) {
              const {ctx, chartArea} = chart;
              if (!chartArea) return;
              const centerX = (chartArea.left + chartArea.right) / 2;
              const centerY = (chartArea.top + chartArea.bottom) / 2;
              ctx.save();
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#0f172a';
              ctx.font = '700 24px sans-serif';
              ctx.fillText(categoryTotal.toLocaleString('en-IN'), centerX, centerY - 8);
              ctx.fillStyle = '#64748b';
              ctx.font = '12px sans-serif';
              ctx.fillText('Total products', centerX, centerY + 16);
              ctx.restore();
          }
      };

      const pieChart = new Chart(ctxPie, {
              type: 'doughnut',
              data: {
                  labels: categoryLabels,
                  datasets: [{
                      data: categoryValues,
                      backgroundColor: categoryColors,
                      borderWidth: 3,
                      borderColor: '#ffffff',
                      hoverBorderWidth: 4,
                      hoverOffset: 12
                  }]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  cutout: '68%',
                  animation: {
                      animateRotate: true,
                      animateScale: true,
                      duration: 900
                  },
                  plugins: {
                      legend: {
                          position: 'bottom',
                          labels: {
                              usePointStyle: true,
                              padding: 16,
                              boxWidth: 10,
                              color: textColor
                          }
                      },
                      tooltip: {
                          callbacks: {
                              label: function(context) {
                                  const value = Number(context.raw || 0);
                                  const percentage = categoryTotal
                                      ? ((value / categoryTotal) * 100).toFixed(1)
                                      : '0.0';
                                  return `${context.label}: ${value.toLocaleString('en-IN')} products (${percentage}%)`;
                              }
                          }
                      }
                  }
              }
          ,
          plugins: [centerTextPlugin]
      });

      if (!categoryLabels.length || !categoryTotal) {
          pieCanvas.parentElement.innerHTML =
              '<div class="chart-empty-state">No product category data available yet.</div>';
      }
          console.log('Pie chart created successfully');
      } else {
          console.error('Pie chart canvas not found');
      }

      // Category Sales Trend Chart
      const trendCanvas = document.getElementById('categoryTrendChart');
      if (trendCanvas) {
          console.log('Creating category sales trend chart...');
          const ctxTrend = trendCanvas.getContext('2d');

          const labels = {{ category_trend_labels|safe }} || [];
          const seriesMap = {{ category_trend_series|safe }} || {};

          const palette = ['#2563eb', '#ec4899', '#f59e0b', '#10b981', '#8b5cf6'];
          const datasets = Object.keys(seriesMap).map((cat, idx) => ({
              label: cat,
              data: seriesMap[cat],
              borderColor: palette[idx % palette.length],
              backgroundColor: palette[idx % palette.length] + '22',
              pointRadius: 2,
              pointHoverRadius: 7,
              pointBackgroundColor: '#ffffff',
              pointBorderWidth: 2,
              borderWidth: 3,
              fill: true,
              tension: 0.4
          }));

          new Chart(ctxTrend, {
              type: 'line',
              data: { labels, datasets },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                      legend: {
                          position: 'top',
                          labels: { color: textColor, usePointStyle: true, padding: 18 }
                      },
                      tooltip: {
                          mode: 'index',
                          intersect: false,
                          callbacks: {
                              label: function(context) {
                                  return context.dataset.label + ': ₹' +
                                      Number(context.parsed.y || 0).toLocaleString('en-IN', {
                                          maximumFractionDigits: 2
                                      });
                              }
                          }
                      }
                  },
                      scales: {
                          x: {
                              ticks: { color: textColor, maxTicksLimit: 10 },
                              grid: { display: false }
                          },
                          y: {
                              beginAtZero: true,
                              ticks: {
                                  color: textColor,
                                  callback: function(value) {
                                      return '₹' + Number(value).toLocaleString('en-IN');
                                  }
                              },
                              grid: { color: gridColor }
                          }
                      }
                  }
          });
      } else {
          console.error('Category trend canvas not found');
      }
  });
</script>

<style>
  .chart-container {
    position: relative;
    width: 100%;
    height: 400px;
    background: linear-gradient(135deg, #f8fbff 0%, #ffffff 100%);
    border-radius: 0.75rem;
    padding: 1rem;
  }

  .chart-empty-state {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 0.95rem;
    text-align: center;
    border: 1px dashed #cbd5e1;
    border-radius: 0.75rem;
    background: #f8fafc;
  }

  #pieChart,
  #categoryTrendChart {
    max-width: 100%;
    height: 100%;
  }
</style>

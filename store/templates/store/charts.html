<div class="row">
    <div class="card shadow border-0 mb-7 col-md-6 col-lg-6">
        <div class="card-body">
            <h5 class="card-title">Category Distribution</h5>
            <div class="chart-container">
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>
    <div class="card shadow border-0 mb-7 col-md-6 col-lg-6">
        <div class="card-body">
            <h5 class="card-title">Category Sales Trend (Last 30 Days)</h5>
            <div class="chart-container">
                <canvas id="categoryTrendChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
<script>
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded, initializing charts...');
        
    // Get current theme
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    const isDark = currentTheme === 'dark';
    
    // Theme-aware colors
    const textColor = isDark ? '#b3b3b3' : '#666';
    const gridColor = isDark ? '#404040' : '#e5e5e5';
    const backgroundColor = isDark ? '#2d2d2d' : '#ffffff';
    
    // Pie Chart
    const pieCanvas = document.getElementById('pieChart');
    if (pieCanvas) {
        console.log('Creating pie chart...');
        const ctxPie = pieCanvas.getContext('2d');
        const pieChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: {{ categories|safe }},
                    datasets: [{
                        data: {{ category_counts|safe }},
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#E7E9ED', '#8E5EA2', '#4BC0C0', '#9966FF', '#FF9F40'],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                usePointStyle: true,
                                padding: 15,
                                color: textColor
                            }
                        },
                        title: {
                            display: true,
                            text: 'Category Distribution',
                            font: {
                                size: 16,
                                weight: 'bold'
                            },
                            color: textColor
                        }
                    },
                    cutout: '60%'
                }
            });
            console.log('Pie chart created successfully');
        } else {
            console.error('Pie chart canvas not found');
        }

        // Category Sales Trend Chart
        const trendCanvas = document.getElementById('categoryTrendChart');
        if (trendCanvas) {
            console.log('Creating category sales trend chart...');
            const ctxTrend = trendCanvas.getContext('2d');

            const labels = {{ category_trend_labels|safe }} || [];
            const seriesMap = {{ category_trend_series|safe }} || {};

            const palette = ['#36A2EB', '#FF6384', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];
            const datasets = Object.keys(seriesMap).map((cat, idx) => ({
                label: cat,
                data: seriesMap[cat],
                borderColor: palette[idx % palette.length],
                backgroundColor: 'transparent',
                pointRadius: 4,
                pointHoverRadius: 6,
                borderWidth: 2,
                fill: false,
                tension: 0.3
            }));

            new Chart(ctxTrend, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top', labels: { color: textColor } },
                        title: { display: true, text: 'Category Sales Trend', color: textColor, font: { size: 16, weight: 'bold' } }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: 'Date', color: textColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, title: { display: true, text: 'Sales (₹)', color: textColor } }
                    }
                }
            });
        } else {
            console.error('Category trend canvas not found');
        }
    });
</script>

  <style>
  .chart-container {
    position: relative;
    width: 100%;
    height: 400px;
    background-color: var(--chart-bg, #ffffff);
    border-radius: 0.375rem;
    padding: 1rem;
    transition: background-color 0.3s ease;
  }

  #pieChart, #categoryTrendChart {
    max-width: 100%;
    height: 100%;
  }
  
  /* Dark mode chart styling */
  [data-theme="dark"] .chart-container {
    background-color: var(--chart-bg);
  }
  </style>

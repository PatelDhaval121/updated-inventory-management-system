<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ❌ REMOVED Webpixels -->

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/custom-colors.css' %}" />

    {% block stylesheets %}{% endblock stylesheets %}

    <title>IMS: {% block title %}{% endblock title %}</title>

    <link rel="icon" href="{% static 'images/logo/favicon.png' %}" />
  </head>

  <body>
    <style>
      .paginator {
        display: flex;
        justify-content: center;
      }
    </style>

    {% include "store/sidebar.html" %}

    <section id="wrapper">
      <nav class="navbar navbar-expand-md custom-navbar">
        <div class="container-fluid mx-2">
          <div class="navbar-header">
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#toggle-navbar"
            >
              <i class="fa fa-bars text-black"></i>
            </button>

            <a class="navbar-brand" href="{% url 'dashboard' %}">
              Inventory<span class="text-black">ms</span>
            </a>
          </div>
        </div>
      </nav>

      {% block content %}{% endblock content %}
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    {% block javascripts %}{% endblock javascripts %}
  </body>
</html>
